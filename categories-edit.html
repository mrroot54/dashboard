<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#14B8A6">
  <title>Edit Category | Green Leaf Kitchen Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="categories.html" class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>
        <div>
          <h1 class="header-title">Edit Category</h1>
          <p class="header-subtitle">Update category details</p>
        </div>
      </div>
      <button class="btn btn-ghost btn-icon text-danger" onclick="confirmDelete('category', currentCategory.id, currentCategory.name)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container page">
    <div class="card">
      <div class="card-body">
        <form id="category-form" onsubmit="handleCategorySubmit(event)">
          <div class="form-group">
            <label class="form-label" for="name">Category Name *</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              class="form-input" 
              placeholder="e.g., Main Course"
              required
            >
          </div>
          
          <div class="form-group">
            <label class="form-label" for="order">Display Order</label>
            <input 
              type="number" 
              id="order" 
              name="order" 
              class="form-input" 
              placeholder="1"
              min="1"
            >
            <p class="text-muted mt-1" style="font-size: 0.8125rem;">Categories are displayed in ascending order.</p>
          </div>
          
          <button type="submit" class="btn btn-primary btn-full btn-lg mt-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            Save Changes
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        </div>
        <h3 class="modal-title">Delete Category?</h3>
        <p class="modal-description">This action cannot be undone.</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
        <button class="btn btn-danger" onclick="executeDeleteAndRedirect()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="index.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="categories.html" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Categories</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="menu-items.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
          <span>Menu</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="users.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Users</span>
        </a>
      </li>
    </ul>
  </nav>

  <script src="js/app.js"></script>
  <script>
    let currentCategory = null;
    
    document.addEventListener('DOMContentLoaded', async () => {
      const id = getUrlParam('id');
      if (!id) {
        window.location.href = 'categories.html';
        return;
      }
      
      // Load categories and find current one
      const categories = await loadCategories();
      currentCategory = categories.find(c => c.id === parseInt(id));
      
      if (!currentCategory) {
        showToast('Category not found', 'error');
        setTimeout(() => window.location.href = 'categories.html', 1000);
        return;
      }
      
      // Populate form
      document.getElementById('name').value = currentCategory.name;
      document.getElementById('order').value = currentCategory.order || 1;
    });
    
    async function executeDeleteAndRedirect() {
      await executeDelete();
      setTimeout(() => {
        window.location.href = 'categories.html';
      }, 500);
    }
  </script>
</body>
</html>
