<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Green Leaf Kitchen</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f9d58,#0a6b3d);
color:white;
text-align:center;
}

.container{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:40px;
border-radius:16px;
max-width:400px;
width:90%;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
font-size:30px;
font-weight:600;
margin-bottom:10px;
}

.subtitle{
font-size:15px;
opacity:.9;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:12px 22px;
border-radius:30px;
background:white;
color:#0f9d58;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.footer{
margin-top:20px;
font-size:12px;
opacity:0.7;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">🌿 Green Leaf Kitchen</div>

<div class="subtitle">
Welcome to our Digital Menu & Ordering System
</div>

<a href="#" class="btn">Enter Website</a>

<div class="footer">
© 2026 Green Leaf Kitchen <br>
Crafted with ❤️ by Atul Kumar
</div>

</div>

</body>
</html>
