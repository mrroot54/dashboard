<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14B8A6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dashboard | Green Leaf Kitchen</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-info">
        <div class="brand-title">Green Leaf Kitchen</div>
        <p class="header-subtitle">Admin Dashboard</p>
      </div>
      <div class="profile-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container page">
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card primary">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        </div>
        <div class="stat-value" id="total-items">0</div>
        <div class="stat-label">Menu Items</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="stat-value" id="total-categories">0</div>
        <div class="stat-label">Categories</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="stat-value" id="total-users">0</div>
        <div class="stat-label">Users</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon" style="background: rgba(245, 158, 11, 0.1); color: #F59E0B;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div class="stat-value" id="total-specials">0</div>
        <div class="stat-label">Specials</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Quick Actions</h2>
      </div>
      <div class="quick-actions">
        <a href="menu-items-new.html" class="quick-action">
          <svg class="quick-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span class="quick-action-label">Add Item</span>
        </a>
        <a href="categories-new.html" class="quick-action">
          <svg class="quick-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            <path d="M12 11v6M9 14h6"/>
          </svg>
          <span class="quick-action-label">Category</span>
        </a>
        <a href="menu-items.html" class="quick-action">
          <svg class="quick-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
          <span class="quick-action-label">Menu</span>
        </a>
        <a href="users.html" class="quick-action">
          <svg class="quick-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
          <span class="quick-action-label">Users</span>
        </a>
      </div>
    </section>

    <!-- Menu Highlights -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Highlights</h2>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10B981;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <div class="stat-value" id="top-selling-count">0</div>
          <div class="stat-label">Top Selling</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(99, 102, 241, 0.1); color: #6366F1;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2 2 7l10 5 10-5-10-5Z"/>
              <path d="m2 17 10 5 10-5"/>
              <path d="m2 12 10 5 10-5"/>
            </svg>
          </div>
          <div class="stat-value" id="recommended-count">0</div>
          <div class="stat-label">Recommended</div>
        </div>
      </div>
    </section>

    <!-- Recent Items -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Recent Items</h2>
        <a href="menu-items.html" class="section-link">View All</a>
      </div>
      <div class="list" id="recent-items"></div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="index.html" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="categories.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Categories</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="menu-items.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
          <span>Menu</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="users.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Users</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Load data
      const categories = await loadCategories();
      const menuItems = await loadMenuItems();
      const users = await loadUsers();
      
      // Animate stats with delay
      setTimeout(() => {
        animateStatsCards();
        
        // Counter animations
        setTimeout(() => {
          animateCounter('total-items', menuItems.length);
          animateCounter('total-categories', categories.length);
          animateCounter('total-users', users.length);
          animateCounter('total-specials', menuItems.filter(i => i.is_special).length);
          animateCounter('top-selling-count', menuItems.filter(i => i.is_top_selling).length);
          animateCounter('recommended-count', menuItems.filter(i => i.is_recommended).length);
        }, 200);
      }, 200);
      
      // Animate quick actions
      setTimeout(() => animateQuickActions(), 400);
      
      // Animate sections
      setTimeout(() => animateSections(), 300);
      
      // Render recent items
      const recentContainer = document.getElementById('recent-items');
      const recentItems = menuItems.slice(0, 3);
      
      recentContainer.innerHTML = recentItems.map(item => `
        <a href="menu-items-edit.html?id=${item.id}" class="list-item">
          ${item.image 
            ? `<img src="${item.image}" alt="${escapeHtml(item.name)}" class="list-item-image"/>`
            : `<div class="list-item-image" style="display:flex;align-items:center;justify-content:center;color:var(--primary);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                  <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
              </div>`
          }
          <div class="list-item-content">
            <div class="list-item-title">${escapeHtml(item.name)}</div>
            <div class="list-item-subtitle">$${parseFloat(item.price).toFixed(2)}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.75">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </a>
      `).join('');
      
      // Animate recent items
      setTimeout(() => animateListItems(), 500);
    });
  </script>
</body>
</html>
