<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#14B8A6">
  <title>New Menu Item | Green Leaf Kitchen Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="menu-items.html" class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>
        <div>
          <h1 class="header-title">New Item</h1>
          <p class="header-subtitle">Add a new menu item</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container page">
    <form id="menu-item-form" onsubmit="handleMenuItemSubmit(event)">
      <!-- Image Upload -->
      <div class="card mb-4">
        <div class="card-body">
          <label class="form-label">Item Image</label>
          <div class="image-upload">
            <svg class="image-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="9" cy="9" r="2"/>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
            <span class="image-upload-text">Tap to upload image</span>
            <input type="file" name="image" accept="image/*">
          </div>
        </div>
      </div>

      <!-- Basic Info -->
      <div class="card mb-4">
        <div class="card-header">
          <h3 class="card-title">Basic Information</h3>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label" for="name">Item Name *</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              class="form-input" 
              placeholder="e.g., Garden Fresh Salad"
              required
            >
          </div>
          
          <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea 
              id="description" 
              name="description" 
              class="form-input form-textarea" 
              placeholder="Describe this menu item..."
              rows="3"
            ></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="price">Price *</label>
            <div class="price-input-wrapper">
              <span class="currency">$</span>
              <input 
                type="number" 
                id="price" 
                name="price" 
                class="form-input" 
                placeholder="0.00"
                step="0.01"
                min="0"
                required
              >
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="category_id">Category</label>
            <select id="category_id" name="category_id" class="form-input form-select">
              <option value="">Select a category</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Flags -->
      <div class="card mb-4">
        <div class="card-header">
          <h3 class="card-title">Menu Highlights</h3>
          <p class="card-description">Mark special attributes for this item</p>
        </div>
        <div class="card-body">
          <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="font-medium">Top Selling</div>
                <div class="text-muted" style="font-size: 0.8125rem;">Show as a popular item</div>
              </div>
              <div class="switch" name="is_top_selling">
                <div class="switch-thumb"></div>
              </div>
            </div>
            
            <div class="flex items-center justify-between">
              <div>
                <div class="font-medium">Special</div>
                <div class="text-muted" style="font-size: 0.8125rem;">Today's special or limited offer</div>
              </div>
              <div class="switch" name="is_special">
                <div class="switch-thumb"></div>
              </div>
            </div>
            
            <div class="flex items-center justify-between">
              <div>
                <div class="font-medium">Recommended</div>
                <div class="text-muted" style="font-size: 0.8125rem;">Chef's recommendation</div>
              </div>
              <div class="switch" name="is_recommended">
                <div class="switch-thumb"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Create Item
      </button>
    </form>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="index.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="categories.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Categories</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="menu-items.html" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
          <span>Menu</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="users.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Users</span>
        </a>
      </li>
    </ul>
  </nav>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Load categories for dropdown
      const categories = await loadCategories();
      const select = document.getElementById('category_id');
      
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.id;
        option.textContent = cat.name;
        select.appendChild(option);
      });
    });
  </script>
</body>
</html>
